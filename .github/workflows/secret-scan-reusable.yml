name: Secret scan (reusable)

# Reusable secret-scanning workflow for every Kodevibehq repo.
#
# Each repo includes this via a 10-line caller at
# `.github/workflows/secret-scan.yml`. The caller does NOT need to pass
# any secrets — the SCAN_INGEST_SECRET lives at the organization level and
# is automatically available to the reusable workflow.
#
# What it does:
#   - On push to main: scan FULL git history. Heavy, but cheap if a baseline
#     is committed (.gitleaks-baseline.json) — historical findings are
#     suppressed by gitleaks' own baseline mechanism.
#   - On pull_request: scan ONLY the PR diff (BASE..HEAD). Fast, blocking.
#   - Either path: POST the report to coolify-proxy.kodevibe.nl/security/
#     scan-results so the Kodend Beveiliging tab shows it per-app.
#
# Non-zero exit on findings — branch protection on `main` makes
# `secret-scan / scan` a required check.

on:
  workflow_call:
    inputs:
      gitleaks_version:
        type: string
        default: "8.21.2"
        description: "Pinned gitleaks release tag (without leading v)."

jobs:
  scan:
    runs-on: ubuntu-latest
    # Cap runtime so a hung gitleaks download, a stuck Tailscale join, or a
    # hanging curl to the tailnet-only Kodend proxy can't burn minutes up to
    # GitHub's 6-hour default ceiling on private (billed) repos.
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for push, PR diff for pull_request)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          V="${{ inputs.gitleaks_version }}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Resolve config (use repo .gitleaks.toml or fall back to org default)
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            echo "Using repo-local .gitleaks.toml"
            echo "GITLEAKS_CONFIG=.gitleaks.toml" >> "$GITHUB_ENV"
          else
            echo "Fetching org-default .gitleaks.toml from Kodevibehq/.github"
            curl -sSL -o /tmp/gitleaks-org.toml \
              https://raw.githubusercontent.com/Kodevibehq/.github/main/.gitleaks.toml
            echo "GITLEAKS_CONFIG=/tmp/gitleaks-org.toml" >> "$GITHUB_ENV"
          fi

      - name: Detect baseline (suppress historical findings if present)
        run: |
          if [ -f .gitleaks-baseline.json ]; then
            echo "GITLEAKS_BASELINE=--baseline-path=.gitleaks-baseline.json" >> "$GITHUB_ENV"
          else
            echo "GITLEAKS_BASELINE=" >> "$GITHUB_ENV"
          fi

      - name: Scan full history (push to main)
        id: scan_push
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set +e
          START=$(date -u +%s%3N)
          gitleaks detect \
            --source . \
            --config "$GITLEAKS_CONFIG" \
            $GITLEAKS_BASELINE \
            --redact \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --exit-code 1 \
            --no-banner
          CODE=$?
          END=$(date -u +%s%3N)
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "duration_ms=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "scan_mode=full-history" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Scan PR diff
        id: scan_pr
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          START=$(date -u +%s%3N)
          gitleaks detect \
            --source . \
            --config "$GITLEAKS_CONFIG" \
            $GITLEAKS_BASELINE \
            --log-opts="${BASE}...${HEAD}" \
            --redact \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --exit-code 1 \
            --no-banner
          CODE=$?
          END=$(date -u +%s%3N)
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "duration_ms=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "scan_mode=pr-diff" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build ingest payload + POST to coolify-proxy
        if: always()
        env:
          SCAN_INGEST_SECRET: ${{ secrets.SCAN_INGEST_SECRET }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER: ${{ github.event_name }}
          EXIT_CODE: ${{ steps.scan_push.outputs.exit_code || steps.scan_pr.outputs.exit_code || '0' }}
          DURATION_MS: ${{ steps.scan_push.outputs.duration_ms || steps.scan_pr.outputs.duration_ms || '0' }}
          SCAN_MODE: ${{ steps.scan_push.outputs.scan_mode || steps.scan_pr.outputs.scan_mode || 'full-history' }}
          WORKFLOW_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          if [ -z "${SCAN_INGEST_SECRET:-}" ]; then
            echo "::warning::SCAN_INGEST_SECRET not set; skipping Kodend ingest."
            exit 0
          fi

          # Normalise the gitleaks report (may be absent on clean scans).
          if [ ! -s /tmp/gitleaks-report.json ]; then
            FINDINGS='[]'
            STATUS='clean'
          elif [ "$EXIT_CODE" = "1" ]; then
            FINDINGS=$(jq -c '[.[] | {
              rule_id: .RuleID,
              fingerprint: .Fingerprint,
              file_path: .File,
              line_number: .StartLine,
              commit_sha: .Commit,
              author: .Author,
              secret_preview: (.Secret // "")
            }]' /tmp/gitleaks-report.json)
            STATUS='findings'
          else
            FINDINGS='[]'
            STATUS='clean'
          fi

          STARTED_AT=$(date -u -d "$(( ${DURATION_MS:-0} / 1000 )) seconds ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg commit "$COMMIT_SHA" \
            --arg branch "$BRANCH" \
            --arg trigger "$TRIGGER" \
            --arg scan_mode "$SCAN_MODE" \
            --arg status "$STATUS" \
            --arg started_at "$STARTED_AT" \
            --arg workflow_run_url "$WORKFLOW_RUN_URL" \
            --argjson pr_number "${PR_NUMBER:-null}" \
            --argjson duration_ms "${DURATION_MS:-0}" \
            --argjson findings "$FINDINGS" \
            '{repo: $repo, commit_sha: $commit, branch: $branch, trigger: $trigger,
              pr_number: $pr_number, scan_mode: $scan_mode, status: $status,
              workflow_run_url: $workflow_run_url, started_at: $started_at,
              duration_ms: $duration_ms, findings: $findings}')

          HTTP=$(curl -sS -o /tmp/ingest.out -w '%{http_code}' \
            -X POST https://coolify-proxy.kodevibe.nl/security/scan-results \
            -H "Authorization: Bearer $SCAN_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD")
          echo "Ingest HTTP $HTTP"
          cat /tmp/ingest.out
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ingest non-200: $HTTP (scan result still applied locally)"
          fi

      - name: Fail the workflow on findings
        if: ${{ steps.scan_push.outputs.exit_code == '1' || steps.scan_pr.outputs.exit_code == '1' }}
        run: |
          echo "::error::gitleaks found one or more secrets — see report above."
          exit 1
