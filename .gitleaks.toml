# Kodevibehq organization-default gitleaks config.
#
# Inherited by every repo's `.github/workflows/secret-scan.yml` caller
# (see .github/workflows/secret-scan-reusable.yml). A repo can override
# any rule by committing its own .gitleaks.toml at the repo root.
#
# Posture: trust upstream defaults for the catalogue; layer allowlists on
# top for the specific noise this org hits (Supabase anon-keys, lockfiles,
# fixtures).

title = "Kodevibehq org-default"

[extend]
useDefault = true

# NOTE — anon-key handling lives in the [allowlist] below, NOT as a [[rules]]
# entry. A custom rule would ADD detections; we want to SUPPRESS them. See
# the `regexes` in [allowlist].

# Global allowlists: paths/files that produce noise but no real risk.
# Lock-files (deterministic hashes), generated bundles, snapshots,
# fixtures, and the bouw-app's Supabase migrations (which contain
# rotated/dev tokens in seed scripts).
[allowlist]
description = "Org-wide noise filter"
# Suppress Supabase ANON keys (public by design — they ship in every
# frontend bundle) while keeping SERVICE_ROLE keys detectable.
#
# A Supabase JWT's payload base64-encodes JSON containing "role":"anon".
# Because base64 alignment depends on the byte offset of that fragment
# (and Supabase emits both compact `"role":"anon"` and spaced/pretty
# `"role": "anon"` payloads), the same text yields different base64
# substrings. We allowlist every alignment variant of the anon role value.
# None of these substrings appear in a service_role token (its role value
# is "service_role"), so those keys still fire.
#
# regexTarget=match → tested against the matched secret (the JWT), not the
# whole line. Verified against MYF/Kodend/Unlabeld history: 0 anon FPs,
# service_role still caught.
regexTarget = "match"
regexes = [
  # compact  "role":"anon"  — 3 byte alignments
  '''InJvbGUiOiJhbm9u''',
  '''b2xlIjoiYW5v''',
  '''cm9sZSI6ImFu''',
  # spaced  "role": "anon"  — 3 byte alignments
  '''InJvbGUiOiAiYW5v''',
  '''b2xlIjogImFu''',
  '''cm9sZSI6ICJh''',
]
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)bun\.lock(b)?$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)poetry\.lock$''',
  '''(^|/)go\.sum$''',
  '''(^|/)__fixtures__/''',
  '''(^|/)__snapshots__/''',
  '''(^|/)fixtures/''',
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)\.cache/''',
  '''\.min\.(js|css)$''',
  '''\.map$''',
  # Self-allowlist: this file documents tokens that LOOK like secrets
  # but are deliberately included as examples / negative tests.
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.gitleaksignore$''',
  '''(^|/)\.infisicalignore$''',
]
